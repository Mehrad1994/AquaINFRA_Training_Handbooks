{% include baseurl.html %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | AquaINFRA Handbook</title>
    <meta name="description" content="{{ page.description | default: site.description }}">

    <!-- Design System CSS -->
    <link rel="stylesheet" href="{{ base }}assets/css/style.css">
    <link rel="stylesheet" href="{{ base }}assets/css/theme.css">
    <link rel="stylesheet" href="{{ base }}assets/css/sidebar.css">

    <!-- Favicon/Brand Colors -->
    <link rel="icon" type="image/svg+xml" href="{{ base }}assets/images/aquainfra_logo.svg">

    <!-- System Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>


    <!-- Main Content Wrapper -->
    <main class="main-wrapper">
        {% if page.hero_title %}
        <div class="page-hero">
            <h1>{{ page.hero_title }}</h1>
        </div>
        {% endif %}
        <div class="handbook-grid">
            <!-- Sidebar Navigation -->
            {% include sidebar.html %}

            <!-- Page Content -->
            <div class="handbook-content">
                {% unless page.title == "Home" %}
                <nav class="breadcrumb" aria-label="Breadcrumb">
                    <a href="{{ base }}index">Home</a>
                    <span class="breadcrumb__sep">›</span>
                    <span class="breadcrumb__current">{{ page.title }}</span>
                </nav>
                {% endunless %}
                {{ content }}
            </div>
        </div>
    </main>


    <!-- Smooth scroll for in-page anchor links (event delegation, guarded) -->
    <script>
        document.addEventListener('click', function (e) {
            var link = e.target.closest('a[href^="#"]');
            if (!link) return;
            var href = link.getAttribute('href');
            if (!href || href === '#' || href.length < 2) return;
            var target = document.getElementById(href.slice(1));
            if (!target) return;
            e.preventDefault();
            target.scrollIntoView({ behavior: 'smooth' });
        });
    </script>

    {% if site.mermaid.enabled %}
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.min.js"
        integrity="sha384-6F4Ibv/ylL12O35KFWTeGTHuBKDz5L6yjKsgv3QHQ8s4NTqlDXq7kMlYXGs7MHFc"
        crossorigin="anonymous"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            mermaid.initialize({ startOnLoad: false, theme: 'default' });
            // Convert Jekyll/Kramdown blocks to Mermaid-compatible format
            document.querySelectorAll('code.language-mermaid').forEach((block) => {
                const pre = block.parentElement;
                const content = block.textContent;
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = content;
                if (pre && pre.tagName === 'PRE') {
                    pre.parentNode.replaceChild(div, pre);
                } else {
                    block.parentNode.replaceChild(div, block);
                }
            });
            mermaid.init(undefined, '.mermaid');
        });
    </script>
    {% endif %}
    <script src="{{ base }}assets/js/sidebar.js"></script>
    <script src="{{ base }}assets/js/copy-code.js"></script>
    <script src="{{ base }}assets/js/glossary-tooltips.js"></script>
    <script src="{{ base }}assets/js/external-links.js"></script>
    <script src="{{ base }}assets/js/tab-switcher.js"></script>
    <script src="{{ base }}assets/js/course-progress.js"></script>

    <!-- GitHub-style Alerts Transformer -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const blockquotes = document.querySelectorAll('blockquote');
            blockquotes.forEach(bq => {
                const firstP = bq.querySelector('p');
                if (firstP && firstP.innerHTML.trim().startsWith('[!')) {
                    const match = firstP.innerHTML.match(/^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]/i);
                    if (match) {
                        const type = match[1].toUpperCase();
                        bq.classList.add('alert-box', `alert-box--${type.toLowerCase()}`);
                        // Remove the trigger text [!TYPE]
                        firstP.innerHTML = firstP.innerHTML.replace(/^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]/i, '').trim();
                        // Prepend a title/icon if desired
                        const label = document.createElement('div');
                        label.className = 'alert-box__label';
                        label.innerHTML = `<strong>${type}</strong>`;
                        bq.insertBefore(label, bq.firstChild);
                    }
                }
            });
        });
    </script>
</body>

</html>
