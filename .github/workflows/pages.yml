name: Deploy to GitHub Pages

# ---------------------------------------------------------------------------
# How to deploy:
#   1. Go to: Settings > Pages > Source  →  select "GitHub Actions" → Save
#      (one-time setup — never needs changing again)
#   2. To publish any branch:
#      Actions > "Deploy to GitHub Pages" > Run workflow > pick branch > Run
#   3. Every push to "main" also auto-deploys (keeps live site in sync).
#
# To switch to a new branch in future:
#   Just run the workflow from that branch (step 2 above).  No other changes.
# ---------------------------------------------------------------------------

on:
  # Auto-deploy whenever main is updated
  push:
    branches:
      - main

  # Manual deploy: lets you pick ANY branch from the GitHub Actions UI
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          working-directory: docs

      - name: Setup Pages (detects repo name → base_path)
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        # Injects the correct baseurl (/AquaINFRA_Training_Handbooks) at build
        # time only. The source _config.yml stays clean (baseurl: "") so the
        # site works identically on localhost and aquainfra.eu without changes.
        run: |
          cd docs
          bundle exec jekyll build \
            --baseurl "${{ steps.pages.outputs.base_path }}" \
            --destination ../_site_gh
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site_gh

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
