name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches:
      - main
      - August_2026_Update
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site_gh
          # configure-pages sets JEKYLL_ENV and injects the correct baseurl
          # via a _config_pages.yml override — no manual baseurl needed.

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site_gh

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
